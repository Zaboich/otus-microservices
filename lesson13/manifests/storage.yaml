# Включая/выключая секцию, переключайте также ее разделитель ---.
# Заголовки # === ... === всегда остаются комментариями.
# === PV ===
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s4-static
spec:
  capacity:
    storage: 3Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /data/k8s4-storage/shared
    type: DirectoryOrCreate

