# === Service ===
apiVersion: v1
kind: Service
metadata:
  name: storage-headless
  namespace: k8s4-storage
spec:
  clusterIP: None
  selector:
    app: storage-set
  ports:
    - name: http
      port: 8080
      targetPort: http

# === StatefulSet ===
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-set
  namespace: k8s4-storage
spec:
  serviceName: storage-headless
  replicas: 2
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: storage-set
  template:
    metadata:
      labels:
        app: storage-set
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.37.0
          command: ["httpd", "-f", "-p", "8080", "-h", "/data"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        storageClassName: ""
        resources:
          requests:
            storage: 1Gi
