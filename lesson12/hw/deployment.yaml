apiVersion: v1
kind: Namespace
metadata:
  name: otus-microservices-12
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimal-http-deployment
  namespace: otus-microservices-12
spec:
  replicas: 3
  selector:
    matchLabels:
      app: minimal-http
  template:
    metadata:
      labels:
        app: minimal-http
    spec:
      containers:
        - name: minimal-http-server
          image: zaboich/minimal-http:amd64
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 25
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 60
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              cpu: 20m
              memory: 32Mi
