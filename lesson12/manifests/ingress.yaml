apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kuber-ingress
  namespace: default
spec:
  # Класс контроллера аддона minikube addons enable ingress.
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: kuber-service
                port:
                  number: 80
