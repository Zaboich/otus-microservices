apiVersion: batch/v1
kind: CronJob
metadata:
  name: clock-demo
  namespace: lab-k8s-5
spec:
  schedule: '* * * * *'
  timeZone: Europe/Moscow
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 30
  suspend: false
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app: clock-demo
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app: clock-demo
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 2
          containers:
            - name: worker
              image: busybox:1.36.1
              command: [sh, -c]
              args: ['date; sleep 10; echo done']
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
